# Talí · Ecosistema Digital Scout — entorno completo con Docker Compose.
#
#   Todo el sistema:         docker compose up -d --build   → http://localhost:8080
#   Solo la base de datos:   docker compose up -d db        (para desarrollar con Visual Studio y ng serve)
#
# Funciona sin configurar nada: si no existe un archivo .env, se usan los valores de desarrollo
# indicados después de ":-" en cada variable. Esos valores son públicos y SOLO sirven para desarrollo.
# En producción, crea un .env a partir de .env.example con valores propios (ver README, sección Producción);
# la API se niega a arrancar en producción si detecta los valores de desarrollo.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecosistema_scout}
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout_desarrollo}
    ports:
      # 5433 en el PC para no chocar con un PostgreSQL instalado localmente (5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-ecosistema_scout}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-ecosistema_scout};Username=${POSTGRES_USER:-scout};Password=${POSTGRES_PASSWORD:-scout_desarrollo}"
      Jwt__Clave: ${JWT_CLAVE:-clave-solo-para-desarrollo-local-no-usar-en-produccion-2026}
      Seed__UsuariosDemo: ${SEED_USUARIOS_DEMO:-true}
      Seed__PasswordDemo: ${SEED_PASSWORD_DEMO:-TaliDemo2026}
      Archivos__Ruta: /app/archivos
    volumes:
      - archivos:/app/archivos
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  archivos:
