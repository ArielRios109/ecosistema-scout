server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite para subir comprobantes y fotos
    client_max_body_size 6M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Las llamadas a /api se reenvían al contenedor de la API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché por mucho tiempo
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier otra ruta carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
