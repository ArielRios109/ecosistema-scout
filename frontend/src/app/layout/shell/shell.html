<mat-toolbar class="barra">
  <button mat-icon-button (click)="menu.toggle()" aria-label="Abrir o cerrar el menú">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="titulo">Ecosistema Scout</span>
  <span class="espacio"></span>

  @if (auth.usuario(); as usuario) {
    <button mat-button [matMenuTriggerFor]="menuUsuario" aria-label="Opciones de la cuenta">
      <mat-icon>account_circle</mat-icon>
      <span class="nombre-usuario">{{ usuario.nombre }}</span>
    </button>
    <mat-menu #menuUsuario="matMenu">
      <div class="datos-usuario" mat-menu-item disabled>
        <span>{{ usuario.email }}</span>
        <small>{{ usuario.roles.join(', ') }}</small>
      </div>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<mat-sidenav-container class="contenedor">
  <mat-sidenav #menu [mode]="modoMenu()" [opened]="!esMovil()" class="menu-lateral">
    <mat-nav-list>
      @for (enlace of enlaces; track enlace.ruta) {
        <a
          mat-list-item
          [routerLink]="enlace.ruta"
          routerLinkActive
          #activo="routerLinkActive"
          [activated]="activo.isActive"
          (click)="esMovil() && menu.close()"
        >
          <mat-icon matListItemIcon>{{ enlace.icono }}</mat-icon>
          <span matListItemTitle>{{ enlace.etiqueta }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
